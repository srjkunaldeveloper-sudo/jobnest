  /api/v1/jobs/:
    get:
      operationId: v1_jobs_list
      description: Get paginated list of job postings with advanced filtering and
        search capabilities
      summary: List jobs
      parameters:
      - in: query
        name: company
        schema:
          type: integer
        description: Filter by company ID
      - in: query
        name: company_slug
        schema:
          type: string
        description: Filter by company slug
      - in: query
        name: education
        schema:
          type: array
          items:
            type: string
        description: Filter by education/qualification slug (can be specified multiple
          times)
      - in: query
        name: exam_type
        schema:
          type: string
      - in: query
        name: fresher
        schema:
          type: boolean
        description: Show only fresher jobs
      - in: query
        name: industry
        schema:
          type: array
          items:
            type: string
        description: Filter by industry slug (can be specified multiple times)
      - in: query
        name: is_remote
        schema:
          type: boolean
        description: Show only remote jobs
      - in: query
        name: job_type
        schema:
          type: array
          items:
            type: string
        description: Filter by job type (full-time, internship, walk-in, government,
          Fresher)
      - in: query
        name: listing_type
        schema:
          type: array
          items:
            type: string
            enum:
            - government
            - standard
            - walk-in
        description: |-
          Listing Type

          * `standard` - Standard
          * `walk-in` - Walk-in
          * `government` - Government
        explode: true
        style: form
      - in: query
        name: location
        schema:
          type: array
          items:
            type: string
        description: Filter by location slug (can be specified multiple times)
      - in: query
        name: max_experience
        schema:
          type: integer
        description: Maximum years of experience
      - in: query
        name: max_salary
        schema:
          type: number
        description: Maximum salary in LPA (Lakhs Per Annum)
      - in: query
        name: min_experience
        schema:
          type: integer
        description: Minimum years of experience
      - in: query
        name: min_salary
        schema:
          type: number
        description: Minimum salary in LPA (Lakhs Per Annum)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order results by field (prefix with - for descending). Options:
          published_on, title, min_salary, max_salary'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number for pagination
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page (max 100)
      - in: query
        name: posted_after
        schema:
          type: string
          format: date
        description: Posted After
      - in: query
        name: posted_before
        schema:
          type: string
          format: date
        description: Posted Before
      - in: query
        name: priority
        schema:
          type: string
        description: Hiring priority
      - in: query
        name: search
        schema:
          type: string
        description: Search in job title, company name, description, and job role
      - in: query
        name: sector
        schema:
          type: array
          items:
            type: string
            enum:
            - agriculture
            - banking
            - construction
            - education
            - govt
            - healthcare
            - hospitality
            - logistics
            - manufacturing
            - media
            - ngo
            - other
            - retail
            - tech
        description: |-
          Industry Sector

          * `tech` - Technology & IT
          * `healthcare` - Healthcare & Medical
          * `education` - Education & Teaching
          * `retail` - Retail & Sales
          * `hospitality` - Hospitality & Travel
          * `manufacturing` - Manufacturing & Production
          * `construction` - Construction & Real Estate
          * `banking` - Banking & Finance
          * `media` - Media & Creative
          * `govt` - Government & Public Sector
          * `logistics` - Logistics & Supply Chain
          * `agriculture` - Agriculture & Farming
          * `ngo` - NGO & Social Work
          * `other` - Other
        explode: true
        style: form
      - in: query
        name: shift_type
        schema:
          type: array
          items:
            type: string
            nullable: true
            enum:
            - day
            - flexible
            - night
            - rotational
        description: |-
          Shift Type

          * `day` - Day Shift
          * `night` - Night Shift
          * `rotational` - Rotational Shift
          * `flexible` - Flexible
        explode: true
        style: form
      - in: query
        name: skills
        schema:
          type: array
          items:
            type: string
        description: Filter by skill slug (can be specified multiple times)
      - in: query
        name: urgent
        schema:
          type: boolean
        description: Approved urgent hiring jobs
      - in: query
        name: work_mode
        schema:
          type: array
          items:
            type: string
            enum:
            - hybrid
            - in-office
            - remote
        description: |-
          Work Mode

          * `in-office` - In-Office
          * `remote` - Remote
          * `hybrid` - Hybrid
        explode: true
        style: form
      tags:
      - Job Seeker · Jobs
      security:
      - BearerAuth: []
      - {}
