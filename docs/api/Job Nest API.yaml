components:
  schemas:
    AIScreenRequestRequest:
      type: object
      properties:
        candidate_id:
          type: integer
          description: JS User ID
        job_id:
          type: integer
      required:
      - candidate_id
      - job_id
    AIScreenResponse:
      type: object
      properties:
        score:
          type: integer
          description: 0–100 match score
        recommendation:
          $ref: '#/components/schemas/RecommendationEnum'
        match_percentage:
          type: integer
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        summary:
          type: string
        candidate_id:
          type: integer
        job_id:
          type: integer
      required:
      - candidate_id
      - gaps
      - job_id
      - match_percentage
      - recommendation
      - score
      - strengths
      - summary
    AcceptInvitationRequest:
      type: object
      description: Serializer for accepting team invitation during signup
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 100
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - first_name
      - last_name
      - password
      - token
    AccountTypeEnum:
      enum:
      - company
      - recruiter
      type: string
      description: |-
        * `company` - company
        * `recruiter` - recruiter
    AdminApplication:
      type: object
      description: Application Tracking row (Admin Panel spec section 11).
      properties:
        id:
          type: integer
          readOnly: true
        applicant:
          type: string
          readOnly: true
        applicant_email:
          type: string
          readOnly: true
        job_title:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status4a7Enum'
        applied_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant
      - applicant_email
      - applied_on
      - company_name
      - id
      - job_title
      - status
    AdminApplicationDetail:
      type: object
      description: 'Full application view: the applicant''s profile, the job, and
        status.'
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/Status4a7Enum'
        applied_on:
          type: string
          format: date-time
          readOnly: true
        applicant:
          type: string
          readOnly: true
        applicant_user_id:
          type: integer
          readOnly: true
        applicant_email:
          type: string
          readOnly: true
        applicant_mobile:
          type: string
          readOnly: true
        applicant_city:
          type: string
          readOnly: true
        user_type:
          type: string
          readOnly: true
        job_title_held:
          type: string
          readOnly: true
          default: ''
        profile_description:
          type: string
          readOnly: true
          default: ''
        linkedin_url:
          type: string
          readOnly: true
          default: ''
        github_url:
          type: string
          readOnly: true
          default: ''
        portfolio_url:
          type: string
          readOnly: true
          default: ''
        current_salary:
          type: integer
          readOnly: true
        expected_salary:
          type: integer
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        mobile_verified:
          type: boolean
          readOnly: true
        skills:
          type: string
          readOnly: true
        job_id:
          type: integer
          readOnly: true
        job_title:
          type: string
          readOnly: true
        job_status:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        job_locations:
          type: string
          readOnly: true
      required:
      - applicant
      - applicant_city
      - applicant_email
      - applicant_mobile
      - applicant_user_id
      - applied_on
      - company_name
      - current_salary
      - email_verified
      - expected_salary
      - github_url
      - id
      - job_id
      - job_locations
      - job_status
      - job_title
      - job_title_held
      - linkedin_url
      - mobile_verified
      - portfolio_url
      - profile_description
      - skills
      - status
      - user_type
    AdminBanner:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        image_url:
          type: string
          readOnly: true
