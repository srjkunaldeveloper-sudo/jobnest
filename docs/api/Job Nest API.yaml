  /api/v1/profile/:
    get:
      operationId: v1_profile_retrieve
      description: Retrieve the authenticated job seeker's complete profile including
        personal info, skills, experience, education, projects, and certifications
      summary: Get user profile
      tags:
      - Job Seeker · Profile
      security:
      - jwtAuth: []
      - tokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: User profile retrieved successfully
        '401':
          description: Authentication credentials were not provided
    put:
      operationId: v1_profile_update
      description: Update the authenticated job seeker's profile. This is a full update
        - all fields should be provided.
      summary: Update user profile (full)
      tags:
      - Job Seeker · Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
            examples:
              UpdateProfileExample:
                value:
                  first_name: John
                  last_name: Doe
                  mobile: '+919876543210'
                  gender: M
                  dob: '1995-05-15'
                  marital_status: Single
                  job_role: Full Stack Developer
                  profile_description: Experienced full stack developer with 5 years
                    of experience in Python and JavaScript
                  year: '5'
                  month: '6'
                  current_salary: '800000'
                  expected_salary: '1200000'
                  notice_period: 30 days
                  relocation: true
                  is_looking_for_job: true
                  is_open_to_offers: true
                  current_city_id: 1
                  preferred_city_ids:
                  - 1
                  - 2
                  - 3
                  email_notifications: true
                  show_email: false
                summary: Update profile example
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: Profile updated successfully
        '400':
          description: Validation error
        '401':
          description: Authentication credentials were not provided
        '403':
          description: Only job seekers can access this endpoint
    patch:
      operationId: v1_profile_partial_update
      description: Partially update the authenticated job seeker's profile. Only provided
        fields will be updated.
      summary: Update user profile (partial)
      tags:
      - Job Seeker · Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
            examples:
              PartialUpdateExample:
                value:
                  first_name: John
                  mobile: '+919876543210'
                  is_looking_for_job: true
                summary: Partial update example
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
