      summary: Proxy registration request to JobNest Django server
      description: Proxies registration payload directly to the main JobNest auth
        endpoint.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                confirm_password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
              required:
              - email
              - password
              - confirm_password
      responses:
        '201':
          description: Successful registration
  /api/auth/login:
    post:
      operationId: gignest_auth_login
      tags:
      - GigNest · Job Seeker Authentication
      summary: Proxy login to Django -> Returns GigNest JWT session
      description: Exchanges Django credentials for a GigNest-specific JWT token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Successful login with session token
  /api/auth/sso:
    post:
      operationId: gignest_auth_sso
      tags:
      - GigNest · Job Seeker Authentication
      summary: Seamless SSO with Django JWT token
      description: Exchanges a valid Django JWT access token for a GigNest JWT session.
      security:
      - BearerAuth: []
      responses:
        '200':
